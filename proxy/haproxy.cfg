# HAProxy: reverse proxy y balanceador delante de las 5 réplicas de la API.
#
# Todo el tráfico pasa por acá (POST /extract, /api/v1/..., /docs); las
# réplicas no publican puertos propios.
#
# Además de repartir pedidos, HAProxy es la primera línea de backpressure:
#
#   cliente ──► frontend ──► COLA CENTRAL (FIFO) ──► réplica libre
#                  │               │
#                  │               └─ si un pedido espera más que
#                  │                  HAPROXY_QUEUE_TIMEOUT → 503
#                  └─ si la cola ya tiene HAPROXY_MAX_QUEUE pedidos
#                     → 503 inmediato (no tiene sentido hacerlo esperar)
#
# Cada réplica recibe como máximo HAPROXY_SERVER_MAXCONN pedidos a la vez
# (maxconn por servidor; por defecto 1, porque cada réplica tiene 1 CPU). El
# resto espera en una sola cola compartida y lo toma la primera réplica que se
# libera. Con colas por réplica (lo que pasa con round-robin "a ciegas"), un
# pedido liviano podría quedar atrás de un PDF de 9 MB mientras otra réplica
# está libre. Los valores por defecto salen de la simulación de colas
# (scripts/simulate_queues.py; ver docs/adr/0002-balanceo-y-backpressure.md).
#
# Las variables "${VAR-valor}" se leen del entorno (definidas en
# docker-compose.yml); el valor después del guion es el que se usa si falta.
# Referencia: https://docs.haproxy.org/3.4/configuration.html

global
    # Logs a stdout, igual que el resto de los servicios (Twelve-Factor, XI).
    log stdout format raw local0 info
    maxconn 4096
    # Tope al buffer de recepción del kernel por conexión de cliente. Sin él,
    # con cientos de uploads grandes esperando en cola, cada socket acumulaba
    # megas de datos y el kernel mató a HAProxy por exceder su memoria (medido:
    # 368 conexiones reseteadas en Vegeta). Con 128 KB, 1.000 pedidos en cola
    # ocupan como mucho ~128 MB.
    tune.rcvbuf.client 131072

defaults
    mode http
    log global
    # httplog incluye los tiempos de cada etapa (Tw = espera en cola,
    # Tc = conexión, Tr = respuesta de la réplica) y el largo de la cola:
    # justo lo que hace falta para analizar el cuello de botella.
    option httplog
    option dontlognull
    timeout connect 5s
    timeout client  60s
    timeout server  60s
    # Tiempo máximo para recibir los encabezados completos. Corta a los
    # clientes que los mandan de a gotas para ocupar conexiones (slowloris);
    # "timeout client" no alcanza porque se reinicia con cada byte recibido.
    timeout http-request 10s
    # Sin este valor, el tiempo de espera de una conexión keep-alive ociosa
    # heredaría los 10 s de arriba: bajo carga, un cliente que tarda en mandar
    # su próximo pedido encontraría la conexión cerrada ("broken pipe").
    timeout http-keep-alive 30s
    # Sin este valor, HAProxy usaría "timeout connect" (5 s) como límite de
    # espera en cola. Por defecto 25 s: deja ~5 s para procesar el PDF antes
    # del timeout de 30 s del cliente; más espera ya no tiene sentido.
    timeout queue "${HAPROXY_QUEUE_TIMEOUT-25s}"
    # Los errores que genera HAProxy usan el mismo formato JSON que la API
# ({"detail": ...}, ver App/api/errors.py).
    http-error status 502 content-type application/json string '{"detail":"La replica no respondio correctamente."}'
    http-error status 503 content-type application/json string '{"detail":"No hubo una replica libre a tiempo; reintente en unos segundos."}' hdr Retry-After 2
    http-error status 504 content-type application/json string '{"detail":"La replica tardo demasiado en responder."}'

# DNS interno de Docker: el nombre "extractor" devuelve la IP de cada réplica.
resolvers docker
    parse-resolv-conf
    hold valid 5s

frontend http_in
    bind :8080
    # Todas las respuestas (también los errores que genera HAProxy) son JSON:
    # se le indica al cliente que no intente adivinar otro tipo de contenido.
    http-after-response set-header X-Content-Type-Options nosniff
    # Health check del propio balanceador (lo usa docker compose): responde 200
    # solo cuando ya ve como disponibles a todas las réplicas esperadas, así
    # las pruebas de carga no arrancan antes de tiempo.
    monitor-uri /haproxy-health
    monitor fail if { nbsrv(extractors) lt "${HAPROXY_EXPECTED_SERVERS-5}" }
    # Rechazo temprano: si la cola ya es tan larga que el pedido no llegaría a
    # atenderse a tiempo, se responde 503 en el momento en vez de hacerlo
    # esperar para nada. Por defecto el límite es alto (solo actúa el timeout
    # de cola); ver docs/INFORME.md para cómo se calibra con la capacidad medida.
    http-request return status 503 content-type application/json string '{"detail":"Cola del balanceador llena; reintente en unos segundos."}' hdr Retry-After 2 if { queue(extractors) ge "${HAPROXY_MAX_QUEUE-1000}" }
    default_backend extractors

backend extractors
    # leastconn: entre las réplicas con lugar libre, la menos ocupada.
    # abortonclose viene activado por defecto en backends HTTP: si el cliente
    # se cansa de esperar y corta, su pedido sale de la cola sin procesarse.
    balance leastconn
    option httpchk GET /health
    http-check expect status 200
    # PDFs chicos primero: los pedidos de menos de HAPROXY_SMALL_PDF_BYTES
    # (1 MB por defecto; 0 = FIFO pura) salen de la cola antes que los
    # grandes. Medido en Vegeta: éxito de 64 % a 80 % y mediana de 25 s a
    # 0,8 s, a cambio de algo de throughput y de cola de latencia en k6
    # (ver ADR-0002 e informe).
    http-request set-priority-class int(-1) if { req.body_size lt "${HAPROXY_SMALL_PDF_BYTES-1048576}" }
    # init-addr none: las réplicas arrancan "caídas" hasta que el DNS de
    # Docker devuelve sus IPs (con libc, las 5 tomarían la misma IP).
    default-server check inter 2s fall 3 rise 2 resolvers docker init-addr none maxconn "${HAPROXY_SERVER_MAXCONN-1}"
    server-template extractor 5 extractor:8000

# Panel de estadísticas en http://localhost:8404: muestra en vivo la cola,
# las sesiones por réplica y los errores mientras corren las pruebas.
frontend stats
    bind :8404
    stats enable
    stats uri /
    stats refresh 2s
