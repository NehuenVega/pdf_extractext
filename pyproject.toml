[project]
name = "pdftrack"
version = "0.1.0"
description = "API para extraer texto de PDFs (FastAPI + MongoDB) con endpoint de Markdown preparado para pruebas de carga"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136.1",
    "motor>=3.7.1",
    "orjson>=3.12.0",
    "pydantic>=2.13.3",
    "pydantic-settings>=2.14.0",
    "pymupdf>=1.28.2,<2",
    "python-multipart>=0.0.27",
    "uvicorn[standard]>=0.46.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]
# Scripts de investigación (scripts/): motores comparados en el ADR-0001 y
# gráficos del informe. No van en la imagen Docker.
scripts = [
    "matplotlib>=3.11.2",
    "pdfplumber>=0.11.10",
    "psutil>=7.2.2",
    "pymupdf4llm>=1.28.2,<2",
    "pypdf>=6.19.0",
    "pypdfium2>=5.14.0",
]

[tool.pytest.ini_options]
pythonpath = [".", "scripts"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
